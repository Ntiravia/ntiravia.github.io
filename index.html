<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:title" content="Nicolò Tiravia · link">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--nero:#0b0b0c;--arancio:#f2683a;--arancio2:#d97757;--bianco:#f4efe8;--grigio:#8a8580;--verde:#3ccf6e;--scheda:rgba(23,23,26,.82);--bordo:rgba(244,239,232,.1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--nero);color:var(--bianco);font-family:Inter,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  /* sfondo come i reel: due luci arancio + asterisco in filigrana */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .glow{position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(242,104,58,.28),rgba(242,104,58,0) 65%)}
  .g1{left:-300px;top:-240px}.g2{right:-320px;bottom:-260px}
  .ast{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;opacity:.05;animation:gira 90s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:64px 20px 36px;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:100vh;min-height:100dvh}
  .ring{width:124px;height:124px;border-radius:50%;padding:4px;background:conic-gradient(from 200deg,var(--arancio),#ffb38f,var(--arancio));box-shadow:0 0 40px rgba(242,104,58,.35)}
  .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--nero);display:block}
  h1{font-weight:900;font-size:30px;letter-spacing:-.03em;margin-top:18px}
  .lab{display:inline-block;margin-top:10px;padding:7px 14px;border-radius:20px;background:rgba(242,104,58,.12);border:1px solid rgba(242,104,58,.4);color:var(--arancio);font:700 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
  .btns{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:40px}
  a{text-decoration:none;color:inherit}
  .b{display:flex;align-items:center;gap:16px;width:100%;padding:16px;border-radius:22px;text-align:left;transition:transform .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent}
  .b:active{transform:scale(.98)}
  .b .t{font-weight:900;font-size:18px;line-height:1.2;letter-spacing:-.01em}
  .b .s{font-size:14px;margin-top:3px;opacity:.7;font-weight:600}
  .b .go{margin-left:auto;flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 18px Inter}
  .sito{background:var(--scheda);border:1px solid var(--bordo);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .sito .ic{flex:none;width:56px;height:56px;border-radius:16px;background:var(--bianco);color:var(--nero);display:flex;align-items:center;justify-content:center;font-size:28px}
  .sito .go{background:rgba(244,239,232,.08);color:var(--bianco)}
  .kit{background:linear-gradient(135deg,#f2683a,#d9502a);color:#141416;box-shadow:0 18px 50px rgba(242,104,58,.35)}
  .kit .cv{flex:none;width:56px;border-radius:8px;box-shadow:0 8px 18px rgba(0,0,0,.45);transform:rotate(-4deg);display:block}
  .kit .s{opacity:.8}
  .kit .free{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 10px;border-radius:10px;background:#0b0b0c;color:var(--verde);font:800 12px Inter}
  .kit .go{background:rgba(11,11,12,.15);color:#141416}
  @media (hover:hover){.b:hover{transform:translateY(-2px)}.sito:hover{border-color:rgba(242,104,58,.5)}}
  .foot{margin-top:auto;padding-top:44px;display:flex;align-items:center;gap:10px;color:var(--grigio);font:700 12px "JetBrains Mono",monospace;letter-spacing:.14em}
  .foot svg{width:18px;height:18px}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="glow g1"></div><div class="glow g2"></div>
  <svg class="ast" viewBox="-100 -100 200 200"><g fill="#f2683a">
    <rect x="-9" y="-96" width="18" height="96" rx="9"/><rect x="-9" y="-96" width="18" height="96" rx="9" transform="rotate(45)"/>
    <rect x="-9" y="-96" width="18" height="96" rx="9" transform="rotate(90)"/><rect x="-9" y="-96" width="18" height="96" rx="9" transform="rotate(135)"/>
    <rect x="-9" y="-96" width="18" height="96" rx="9" transform="rotate(180)"/><rect x="-9" y="-96" width="18" height="96" rx="9" transform="rotate(225)"/>
    <rect x="-9" y="-96" width="18" height="96" rx="9" transform="rotate(270)"/><rect x="-9" y="-96" width="18" height="96" rx="9" transform="rotate(315)"/></g></svg>
</div>
<main>
  <div class="ring"><img src="img/omino.png" alt="Nicolò Tiravia"></div>
  <h1>Nicolò Tiravia</h1>
  <span class="lab">AI Specialist · Digital Advertiser</span>

  <div class="btns">
    <a class="b sito" href="https://nicolotiraviaportfolio.netlify.app/">
      <span class="ic">🌐</span>
      <span><span class="t">Il mio sito</span><span class="s" style="display:block">Chi sono e cosa faccio</span></span>
      <span class="go">→</span>
    </a>
    <a class="b kit" href="kit/">
      <img class="cv" src="img/kit.png" alt="">
      <span><span class="t">Kit anti-truffa AI per la famiglia</span><span class="s" style="display:block">PDF di 14 pagine</span><span class="free">🎁 Gratis se mi segui</span></span>
      <span class="go">→</span>
    </a>
  </div>

  <a class="foot" href="https://www.instagram.com/nicolotiravia.ai/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
    @NICOLOTIRAVIA.AI
  </a>
</main>
</body>
</html>
